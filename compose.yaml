services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: course
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d course"]
      interval: 2s
      timeout: 3s
      retries: 15

  db-bootstrap:
    image: postgres:17
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    command:
      - sh
      - -c
      - |
        set -eu

        psql \
          -h postgres \
          -U postgres \
          -d course \
          -v ON_ERROR_STOP=1 \
          <<'SQL'

        DO $$
        BEGIN
            IF NOT EXISTS (
                SELECT 1
                FROM pg_roles
                WHERE rolname = 'course_runtime'
            ) THEN
                CREATE ROLE course_runtime NOLOGIN;
            END IF;

            IF NOT EXISTS (
                SELECT 1
                FROM pg_roles
                WHERE rolname = 'course_api'
            ) THEN
                CREATE ROLE course_api NOLOGIN;
            END IF;

            IF NOT EXISTS (
                SELECT 1
                FROM pg_roles
                WHERE rolname = 'api_owner'
            ) THEN
                CREATE ROLE api_owner NOLOGIN NOSUPERUSER;
            END IF;

            IF NOT EXISTS (
                SELECT 1
                FROM pg_roles
                WHERE rolname = 'course_migration_login'
            ) THEN
                CREATE ROLE course_migration_login
                    LOGIN
                    PASSWORD 'migration_secret_change_me';
            END IF;

            IF NOT EXISTS (
                SELECT 1
                FROM pg_roles
                WHERE rolname = 'course_api_login'
            ) THEN
                CREATE ROLE course_api_login
                    LOGIN
                    PASSWORD 'api_secret_change_me';
            END IF;

            IF NOT EXISTS (
                SELECT 1
                FROM pg_roles
                WHERE rolname = 'course_cli_login'
            ) THEN
                CREATE ROLE course_cli_login
                    LOGIN
                    PASSWORD 'cli_secret_change_me';
            END IF;
        END
        $$;

        GRANT CONNECT, CREATE
        ON DATABASE course
        TO course_migration_login;

        GRANT CONNECT
        ON DATABASE course
        TO course_api_login;

        GRANT CONNECT, CREATE
        ON DATABASE course
        TO course_cli_login;

        GRANT api_owner
        TO course_migration_login
        WITH ADMIN OPTION;

        GRANT api_owner
        TO course_cli_login
        WITH ADMIN OPTION;

        GRANT course_runtime
        TO course_api_login;

        GRANT course_api
        TO course_cli_login;

        SQL

  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    environment:
      ConnectionStrings__Course: "Host=postgres;Port=5432;Database=course;Username=course_api_login;Password=api_secret_change_me"
      MIGRATION_CONNECTION_STRING: "Host=postgres;Port=5432;Database=course;Username=course_migration_login;Password=migration_secret_change_me"
      COURSE_JWT_SIGNING_KEY: "${COURSE_JWT_SIGNING_KEY:-moduledev-week1-rotated-key-do-not-use-in-production-2026-aug}"
    depends_on:
      postgres:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      Api__BaseUrl: "http://api:8080"
    depends_on:
      api:
        condition: service_started

  cli:
    build:
      context: .
      dockerfile: src/Cli/Dockerfile
    environment:
      ConnectionStrings__Course: "Host=postgres;Port=5432;Database=course;Username=course_cli_login;Password=cli_secret_change_me"
    depends_on:
      postgres:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully

volumes:
  pgdata: